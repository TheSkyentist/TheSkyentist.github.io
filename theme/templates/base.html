<html>
    <head>
        <!-- Google tag (gtag.js) -->
        <script
            async
            src="https://www.googletagmanager.com/gtag/js?id=G-H0JZX8MWRX"
        ></script>
        <script>
            window.dataLayer = window.dataLayer || [];
            function gtag() {
                dataLayer.push(arguments);
            }
            gtag("js", new Date());
            gtag("config", "G-H0JZX8MWRX");
        </script>
        <title>{{ SITENAME }}</title>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link
            rel="stylesheet"
            href="{{ SITEURL }}/{{ THEME_STATIC_DIR }}/css/main.css"
        />
        <meta
            name="description"
            content="Professional Website of Raphael Hviding, Postdoctoral Researcher"
        />
        <meta name="author" content="Raphael Hviding" />
        <meta
            name="keywords"
            content="Raphael,Hviding,Research,Astronomy,Astrophysics"
        />
        {% block extra_head %}{% endblock %}
    </head>

    <body>
        <div id="page-wrapper">
            <!-- Header -->
            <div id="header">
                <!-- Nav -->
                <nav id="nav">
                    <ul>
                        <li>
                            <a
                                href="{{ SITEURL }}/files/cv_reh.pdf"
                                target="_blank"
                                >Full CV</a
                            >
                        </li>
                        <li>
                            <a href="#cta" class="js-copy-email">Contact</a>
                        </li>
                        <li>
                            <a
                                href="https://ui.adsabs.harvard.edu/search/p_=0&q=author%3A%22Hviding%2C%20Raphael%20E.%22&sort=date%20desc%2C%20bibcode%20desc"
                                target="_blank"
                                >ADS Library</a
                            >
                        </li>
                    </ul>
                </nav>
            </div>

            <!-- Main -->
            {% block content %}{% endblock %}

            <!-- Footer -->

            <!-- Icons -->
            <section id="cta" class="wrapper style3">
                <ul class="icons">
                    <li>
                        <a
                            href="mailto:hviding@mpia.de"
                            class="icon fa-envelope js-copy-email"
                            ><span class="label">Email</span></a
                        >
                    </li>
                    <li>
                        <a
                            href="https://www.github.com/TheSkyentist"
                            target="_blank"
                            class="icon fa-github"
                            ><span class="label">GitHub</span></a
                        >
                    </li>
                    <li>
                        <a
                            href="https://orcid.org/0000-0002-4684-9005"
                            target="_blank"
                            class="icon fa-orcid"
                            ><span class="label">ORCID</span></a
                        >
                    </li>
                    <li>
                        <a
                            href="https://www.linkedin.com/in/raphael-hviding-1b724a107"
                            target="_blank"
                            class="icon fa-linkedin-square"
                            ><span class="label">LinkedIn</span></a
                        >
                    </li>
                </ul>
            </section>

            <div id="footer">
                <!-- Copyright -->
                <div class="copyright">
                    <ul class="menu">
                        <li>
                            &copy; Raphael E. Hviding 2026. All rights reserved
                        </li>
                        <li>
                            Design:
                            <a href="http://html5up.net" target="_blank"
                                >HTML5 UP</a
                            >
                        </li>
                    </ul>
                </div>
            </div>
        </div>

        <!-- Scripts -->
        <script src="{{ SITEURL }}/{{ THEME_STATIC_DIR }}/js/fastscroll.js"></script>
        <script src="{{ SITEURL }}/{{ THEME_STATIC_DIR }}/js/jquery.min.js"></script>
        <script src="{{ SITEURL }}/{{ THEME_STATIC_DIR }}/js/jquery.dropotron.min.js"></script>
        <script src="{{ SITEURL }}/{{ THEME_STATIC_DIR }}/js/browser.min.js"></script>
        <script src="{{ SITEURL }}/{{ THEME_STATIC_DIR }}/js/breakpoints.min.js"></script>
        <script src="{{ SITEURL }}/{{ THEME_STATIC_DIR }}/js/util.js"></script>
        <script src="{{ SITEURL }}/{{ THEME_STATIC_DIR }}/js/main.js"></script>
        <script src="{{ SITEURL }}/{{ THEME_STATIC_DIR }}/js/contact.js"></script>
    </body>
</html>
